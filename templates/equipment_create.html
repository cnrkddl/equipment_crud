{% extends "base.html" %}
{% block title %}장비 등록{% endblock %}
{% block content %}
  <h1>장비 등록</h1>

  <form method="post" class="form-shell">
    <div class="field">
      <label class="form-label" for="equipment_code">장비번호<span class="required-mark">*</span></label>
      <input class="form-control code" type="text" id="equipment_code" name="equipment_code"
             value="{{ form.equipment_code if form else '' }}">
    </div>
    <div class="field">
      <label class="form-label" for="name">장비명<span class="required-mark">*</span></label>
      <input class="form-control" type="text" id="name" name="name"
             value="{{ form.name if form else '' }}">
    </div>
    <div class="field">
      <label class="form-label" for="location">설치장소</label>
      <input class="form-control" type="text" id="location" name="location"
             value="{{ form.location if form else '' }}">
    </div>
    <div class="field">
      <label class="form-label" for="status">장비상태</label>
      <select class="form-select" id="status" name="status">
        {% for option in equipment_statuses %}
          <option value="{{ option }}" {% if form and form.status == option %}selected{% endif %}>
            {{ option }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label class="form-label" for="description">설명</label>
      <textarea class="form-control" id="description" name="description" rows="3">{{ form.description if form else '' }}</textarea>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">등록</button>
      <a class="btn btn-secondary" href="{{ url_for('equipment_list') }}">취소</a>
    </div>
  </form>
{% endblock %}
